# Preise in USD pro 1 Mio. Tokens (Anthropic-Erstanbieter-Tarife, Stand 2026-10).
# Schlüssel: <provider>:<modell> wie in .env. Nicht gelistete Modelle werden mit 0 erfasst (Warnung im Log).
# cache_write = 5-Minuten-Cache (1,25 × input).
modelle:
  anthropic:claude-opus-5-5:   {input: 4.00, output: 20.00, cache_read: 0.20, cache_write: 5.00}
  anthropic:claude-sonnet-5-5: {input: 2.00, output: 10.00, cache_read: 0.20, cache_write: 2.50}
  anthropic:claude-haiku-5-5:  {input: 0.10, output: 0.50,  cache_read: 0.01, cache_write: 0.125}

# Fallback pro Provider, wenn ein Modell nicht explizit gelistet ist.
provider_default:
  ollama: {input: 0, output: 0, cache_read: 0, cache_write: 0}
